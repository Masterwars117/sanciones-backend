name: ${DOCKER_DEV_NAME}

services:
  django:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "${DOCKER_DEV_DJANGO_PORT}:8000"
    volumes:
      - ../../:/app
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: no
    command: >
      sh -c "
        python manage.py migrate && python manage.py runserver 0.0.0.0:8000
      "

  postgres_db:
    image: postgres:16.4-bookworm
    volumes:
      - postgres_db_data:/var/lib/postgresql/data/
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_DB=${DOCKER_DEV_POSTGRES_DB_NAME}
      - POSTGRES_USER=${DOCKER_DEV_POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${DOCKER_DEV_POSTGRES_DB_PASSWORD}
      - TZ=America/Mexico_City
    ports:
      - "${DOCKER_DEV_POSTGRES_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_db_data:
